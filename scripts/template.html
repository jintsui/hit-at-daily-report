<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*__REPORT_TITLE__*/</title>
<style>
:root{
  --sage:#7B9E89; --sage-light:#A4BFB4; --sage-dark:#4A6E5C;
  --amber:#D4A857; --amber-light:#E5C485; --amber-dark:#A07F3D;
  --clay:#C77764; --clay-light:#E0A091; --clay-dark:#9B5040;
  --bg:#F5F1EA; --bg-card:#FFFFFF; --grid:#E5DFD8;
  --fg:#2C2926; --fg-muted:#6B6661;
  --blue:#5B7C99; --purple:#8E7BA8; --teal:#5FA3A0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans Pro","Microsoft YaHei","微软雅黑",sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;padding:24px 32px;max-width:1320px;margin:0 auto}

/* header */
.report-header{border-bottom:2px solid var(--sage-dark);padding-bottom:16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.report-header h1{font-size:27px;font-weight:700;color:var(--sage-dark);letter-spacing:.5px}
.report-header .meta{font-size:13px;color:var(--fg-muted);margin-top:6px}
.report-header .meta strong{color:var(--sage-dark)}
.src-note{font-size:11px;color:#8a8f8c;margin-top:4px;max-width:760px}
#lang-toggle,#upload-toggle,#download-btn{flex:0 0 auto;border:1px solid var(--sage-dark);background:var(--bg-card);color:var(--sage-dark);border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;font-weight:600}
#lang-toggle:hover,#upload-toggle:hover,#download-btn:hover{background:var(--sage-dark);color:#fff}
.hdr-actions{display:flex;gap:8px;flex:0 0 auto}
#drop-modal{position:fixed;inset:0;background:rgba(30,26,22,.5);display:none;align-items:center;justify-content:center;z-index:60}
#drop-modal.show{display:flex}
#drop-box{background:#fff;border-radius:8px;padding:24px;width:520px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#drop-box h3{color:var(--sage-dark);margin-bottom:6px;font-size:17px}
#drop-box p{font-size:12.5px;color:var(--fg-muted);margin-bottom:14px}
#drop-zone{border:2px dashed var(--sage-light);border-radius:6px;padding:26px;text-align:center;color:var(--fg-muted);font-size:13px;cursor:pointer;background:#fbfaf7}
#drop-zone.hover{border-color:var(--sage-dark);background:#f0f4ed}
#drop-zone b{color:var(--sage-dark)}
#drop-list{font-size:12px;margin:10px 0;color:var(--sage-dark);min-height:18px}
#drop-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
#drop-actions button,#drop-download{border-radius:4px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--sage-dark)}
#drop-download{background:var(--amber-dark);color:#fff;text-decoration:none;display:inline-block}
#drop-download:hover{background:var(--amber)}
#drop-load{background:#fff;color:var(--sage-dark)}
#drop-run{background:var(--sage-dark);color:#fff}
#drop-cancel{background:#fff;color:var(--sage-dark)}
#drop-msg{font-size:12.5px;margin-top:10px}

/* nav */
#layer-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:30}
#layer-nav button{border:1px solid var(--grid);background:var(--bg-card);color:var(--fg-muted);border-radius:4px;padding:9px 18px;font-size:14px;cursor:pointer;font-weight:600;transition:.15s}
#layer-nav button:hover{border-color:var(--sage)}
#layer-nav button.active{background:var(--sage-dark);border-color:var(--sage-dark);color:#fff}

.section{background:var(--bg-card);border:1px solid var(--grid);border-radius:5px;padding:22px 26px;margin-bottom:22px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.section h2{font-size:19px;font-weight:600;color:var(--sage-dark);border-bottom:1px solid var(--grid);padding-bottom:8px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.section h2 .kicker{font-size:11px;letter-spacing:1px;color:var(--fg-muted);font-weight:600;text-transform:uppercase}
.grid{display:grid;gap:18px}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c3{grid-template-columns:1fr 1fr 1fr}
.grid.c2-1{grid-template-columns:1.35fr 1fr}
@media(max-width:1000px){.grid.c2,.grid.c3,.grid.c2-1{grid-template-columns:1fr}}
.panel-title{font-size:13px;font-weight:600;color:var(--sage-dark);margin-bottom:6px}
.panel-sub{font-size:11px;color:var(--fg-muted);margin-bottom:8px}
.chart{width:100%;height:300px}
.chart.tall{height:380px}

/* KPI tiles */
.kpis{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px}
.kpi{flex:1 1 190px;min-width:170px;padding:16px 18px;border:1px solid var(--grid);border-left:4px solid var(--sage);border-radius:5px;background:var(--bg-card)}
.kpi.amber{border-left-color:var(--amber-dark)}
.kpi.clay{border-left-color:var(--clay-dark)}
.kpi.neutral{border-left-color:var(--grid)}
.kpi .k-label{font-size:12px;color:var(--fg-muted);font-weight:600}
.kpi .k-value{font-size:26px;font-weight:700;color:var(--sage-dark);margin:4px 0 2px;letter-spacing:.5px}
.kpi.amber .k-value{color:var(--amber-dark)}
.kpi.clay .k-value{color:var(--clay-dark)}
.kpi .k-sub{font-size:11px;color:var(--fg-muted)}

/* conclusion cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:900px){.cards{grid-template-columns:1fr}}
.card{border:1px solid var(--grid);border-radius:5px;padding:14px 16px;border-top:3px solid var(--sage);background:linear-gradient(180deg,#fbfaf7,#fff)}
.card.amber{border-top-color:var(--amber-dark)}
.card.clay{border-top-color:var(--clay-dark)}
.card .c-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;color:#fff;background:var(--sage);border-radius:3px;padding:2px 8px;margin-bottom:8px}
.card.amber .c-tag{background:var(--amber-dark)}
.card.clay .c-tag{background:var(--clay-dark)}
.card .c-title{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--fg)}
.card .c-body{font-size:12.5px;color:var(--fg-muted)}

/* tables */
.tbl-wrap{overflow:auto;max-height:420px;border:1px solid var(--grid);border-radius:4px}
table.data{border-collapse:collapse;width:100%;font-size:12px;font-family:"Microsoft YaHei",sans-serif}
table.data th{background:#eef3ec;color:#2d4a3a;font-weight:600;padding:8px 10px;border-bottom:2px solid #c7d4c4;text-align:left;white-space:nowrap;position:sticky;top:0}
table.data td{padding:7px 10px;border-bottom:1px solid #eee8e0;white-space:nowrap}
table.data tbody tr:hover{background:#f6f8f4}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:#a9a49e}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;background:#eef3ec;color:var(--sage-dark);font-weight:600}
.common-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.common-chip{font-size:12px;background:#f0f4ed;border:1px solid #d8e2d4;border-radius:4px;padding:5px 11px;color:#3a5245}
.common-chip b{color:var(--sage-dark);font-weight:700}
.common-chip span{color:#8a9089;font-size:11px;margin-right:5px}

details.concl{border:1px solid var(--grid);border-radius:5px;padding:10px 14px;margin-top:14px;background:#fbfaf7}
details.concl summary{cursor:pointer;font-weight:600;color:var(--sage-dark);font-size:13.5px}
details.concl .body{font-size:12.5px;color:var(--fg-muted);margin-top:8px}
details.concl ul{margin:6px 0 0 18px}
details.concl li{margin:3px 0}

/* map */
.map-wrap{position:relative;border:1px solid var(--grid);border-radius:5px;overflow:hidden;background:#1d2420}
#map-canvas{display:block;width:100%;height:760px;cursor:grab;touch-action:none}
#map-canvas.dragging{cursor:grabbing}
#map-zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#map-zoom button{width:32px;height:32px;border:1px solid var(--grid);background:rgba(255,255,255,.94);color:var(--sage-dark);border-radius:4px;font-size:16px;font-weight:700;cursor:pointer;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#map-zoom button:hover{background:var(--sage-dark);color:#fff}
.map-legend{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border-radius:4px;padding:8px 10px;font-size:11.5px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.map-legend label{display:flex;align-items:center;gap:6px;cursor:pointer;padding:1px 0}
.map-legend .dot{width:10px;height:10px;border-radius:50%}
.map-controls{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.map-controls button{border:1px solid var(--sage-dark);background:var(--bg-card);color:var(--sage-dark);border-radius:4px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600}
.map-controls button:hover{background:var(--sage-dark);color:#fff}
.map-controls .speedbtn.active{background:var(--sage-dark);color:#fff}
#map-time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sage-dark);font-size:14px;min-width:64px}
#map-slider{flex:1;min-width:220px;accent-color:var(--sage-dark)}
.footer{text-align:center;font-size:11.5px;color:var(--fg-muted);padding:18px 0 8px}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="report-header">
  <div>
    <h1 id="report-title">—</h1>
    <div class="meta">
      <span data-i18n="meta.port"></span>:<span id="port">—</span>
      <span id="port-label" class="mut"></span> ·
      <span data-i18n="meta.window"></span>:<strong id="data-window">—</strong> ·
      <span data-i18n="meta.date"></span>:<span id="report-date">—</span>
    </div>
    <div class="src-note" id="src-note"></div>
  </div>
  <div class="hdr-actions">
    <button id="upload-toggle" data-i18n="g.upload">上传数据</button>
    <button id="download-btn" data-i18n="g.download">下载报告</button>
    <button id="lang-toggle">EN</button>
  </div>
</header>

<div id="drop-modal">
  <div id="drop-box">
    <h3 data-i18n="g.upload.title"></h3>
    <p data-i18n="g.upload.hint"></p>
    <div id="drop-zone"></div>
    <input id="drop-input" type="file" multiple accept=".zip,.xlsx,.csv" class="hidden">
    <div id="drop-list"></div>
    <div id="drop-msg"></div>
    <div id="drop-actions"><a id="drop-download" class="hidden" data-i18n="g.upload.download"></a><button id="drop-load" class="hidden" data-i18n="g.upload.load"></button><button id="drop-cancel" data-i18n="g.upload.cancel"></button><button id="drop-run" data-i18n="g.upload.run"></button></div>
  </div>
</div>

<nav id="layer-nav"></nav>

<main id="sections"></main>

<footer class="footer" data-i18n="footer"></footer>

function s(k){var v=I18N[k];if(!v)return k;return LANG==='en'?v[1]:v[0];}

/* ===================== header ===================== */
function renderHeader(){
  document.getElementById('report-title').textContent=(LANG==='en'?'HIT AT Efficiency Diagnostic Daily · ':'HIT AT 效率诊断日报 · ')+RD.meta.report_date;
  document.getElementById('port').textContent=RD.meta.port;
  document.getElementById('port-label').textContent=t(RD.meta.port_label);
  document.getElementById('data-window').textContent=RD.meta.data_window;
  document.getElementById('report-date').textContent=RD.meta.report_date;
  document.getElementById('src-note').textContent=t(RD.source_note);
  document.getElementById('lang-toggle').textContent=(LANG==='en'?'中文':'EN');
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=s(el.getAttribute('data-i18n'));});
}

/* ===================== nav ===================== */
function renderNav(){
  var layers=[['conclusion','nav.conclusion'],['description','nav.description'],['diagnosis','nav.diagnosis'],['focus','nav.focus']];
  var nav=document.getElementById('layer-nav'); nav.innerHTML='';
  layers.forEach(function(l,i){
    var b=document.createElement('button');
    b.textContent=s(l[1]); b.dataset.idx=i; if(i===0)b.classList.add('active');
    b.onclick=function(){
      nav.querySelectorAll('button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      var secs=document.querySelectorAll('#sections > section');
      secs.forEach(function(sec,j){sec.classList.toggle('hidden', j!==i);});
      Object.keys(CHARTS).forEach(function(k){try{CHARTS[k].resize()}catch(e){}});
      if(mapCtx) resizeMap();
      window.scrollTo({top:0,behavior:'smooth'});
    };
    nav.appendChild(b);
  });
}

function taskTableHTML(tt){
  var FT={'45':'40','22':'20','20':'20'};
  function szName(k){var g=FT[k];return g?(LANG==='en'?g+' ft':g+' 英尺'):(LANG==='en'?'size '+k:'码 '+k);}
  var h='<table class="data"><thead><tr><th class="num">'+s('t.rank')+'</th><th class="num">'+s('t.dur')+'</th><th>'+s('t.vehicle')+'</th><th>'+s('t.qc')+'</th><th>'+s('t.bay')+'</th><th>'+s('t.dir')+'</th><th>'+s('t.size')+'</th><th class="num">'+s('t.start')+'</th></tr></thead><tbody>';
  tt.forEach(function(x,i){
    h+='<tr><td class="num">'+(i+1)+'</td><td class="num"><b>'+n1(x.dur)+'</b></td><td>'+esc(x.vehicle)+'</td><td>'+esc(x.qc?qcName(x.qc):'—')+'</td>'
      +'<td>'+esc(x.bay||'—')+'</td><td>'+esc(x.dir||'—')+'</td><td>'+szName(x.size)+'</td><td class="num">'+esc(x.start||'—')+'</td></tr>';
  });
  h+='</tbody></table>';
  return h;
}

function slowTable(){
  var M=RD.movement||{}, tt=M.slow_boxes||[], sm=M.slow_summary||{};
  var el=document.getElementById('slow-table');
  if(!el)return;
  var chips=[];
  function kv(obj,fmt){return Object.keys(obj).map(function(k){return fmt(k)+' ×'+obj[k];}).join(' · ');}
  chips.push(['t.hits', String(sm.n||0)+' / '+(RD.movement.total||0)+' ('+(sm.pct||0)+'%)']);
  if(sm.dir) chips.push(['c.dir', kv(sm.dir,function(k){return k;})]);
  if(sm.qc) chips.push(['c.qc', kv(sm.qc,function(k){return qcName(k);})]);
  if(sm.vehicle) chips.push(['t.vehicle2', kv(sm.vehicle,function(k){return k;})]);
  el.innerHTML=taskTableHTML(tt)+'<div class="common-strip">'+chips.map(function(c){return '<div class="common-chip"><span>'+s(c[0])+'</span>'+c[1]+'</div>';}).join('')+'</div>';
}

  // fleet bar + line
  var c=mk('chart-fleet-bar');

    xAxis:Object.assign(axisBase(),{type:'category',data:VEHS}),
    yAxis:[Object.assign(axisBase(),{type:'value',name:s('t.boxes')}),Object.assign(axisBase(),{type:'value',name:'km',splitLine:{show:false}})],
    series:[
      {name:s('t.boxes'),type:'bar',data:RD.fleet.map(function(x){return x.boxes}),itemStyle:{color:'#7B9E89',borderRadius:[3,3,0,0]},barWidth:'46%'},
      {name:s('t.mileage'),type:'line',yAxisIndex:1,data:RD.fleet.map(function(x){return x.mileage_km}),itemStyle:{color:'#C77764'},lineStyle:{width:2.5},symbolSize:7}
    ]});

/* ===================== map ===================== */
var mapCtx=null, baseCv=null, trailCv=null, heatCv=null, mapHeat=true, mapT=0, mapPlaying=false, mapSpeed=10, lastTs=0;
var mapZoom=1, mapPanX=0, mapPanY=0, mapDrag=false, lastX=0, lastY=0;
var mapSel={}, mapBounds=null, mapDpr=Math.min(window.devicePixelRatio||1,2);
function fmtT(sec){var hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60),ss=Math.floor(sec%60);return ('0'+hh).slice(-2)+':'+('0'+mm).slice(-2)+':'+('0'+ss).slice(-2);}
function bsearch(pts,T){var lo=0,hi=pts.length-1;while(lo<hi){var mid=(lo+hi+1)>>1;if(pts[mid][0]<=T)lo=mid;else hi=mid-1;}return lo;}
function baseScale(){
  var cv=document.getElementById('map-canvas');var W=cv.clientWidth,H=cv.clientHeight;
  var b=mapBounds,pad=36;
  return Math.min((W-2*pad)/(b.maxx-b.minx||1),(H-2*pad)/(b.maxy-b.miny||1));
}
function mapTransform(){
  var cv=document.getElementById('map-canvas');var W=cv.clientWidth,H=cv.clientHeight;
  var b=mapBounds;var sc=baseScale()*mapZoom;
  var ox=(W-(b.maxx-b.minx)*sc)/2+mapPanX, oy=(H-(b.maxy-b.miny)*sc)/2+mapPanY;
  return {sc:sc,ox:ox,oy:oy,X:function(x){return ox+(x-b.minx)*sc},Y:function(y){return oy+(b.maxy-y)*sc}};
}
function redrawMap(){drawHeat();drawBase();drawTrail(0,mapT,true);paintFrame();}
function clampPan(){
  var cv=document.getElementById('map-canvas');var W=cv.clientWidth,H=cv.clientHeight;
  var b=mapBounds,sc=baseScale()*mapZoom;
  var lx=Math.max(0,(b.maxx-b.minx)*sc/2-W/2+40), ly=Math.max(0,(b.maxy-b.miny)*sc/2-H/2+40);
  mapPanX=Math.max(-lx,Math.min(lx,mapPanX));mapPanY=Math.max(-ly,Math.min(ly,mapPanY));
}
function zoomAt(mx,my,factor){
  if(!mapBounds)return;
  var cv=document.getElementById('map-canvas');var W=cv.clientWidth,H=cv.clientHeight,b=mapBounds;
  var nz=Math.max(1,Math.min(20,mapZoom*factor));if(nz===mapZoom)return;
  var o0=baseScale()*mapZoom;
  var ox0=(W-(b.maxx-b.minx)*o0)/2+mapPanX, oy0=(H-(b.maxy-b.miny)*o0)/2+mapPanY;
  var wx=b.minx+(mx-ox0)/o0, wy=b.maxy-(my-oy0)/o0;
  mapZoom=nz;
  var ns=baseScale()*nz;
  var oxT=mx-(wx-b.minx)*ns, oyT=my-(b.maxy-wy)*ns;
  mapPanX=oxT-(W-(b.maxx-b.minx)*ns)/2; mapPanY=oyT-(H-(b.maxy-b.miny)*ns)/2;
  if(mapZoom<=1.001){mapZoom=1;mapPanX=0;mapPanY=0;}
  clampPan();redrawMap();
}
function resizeMap(){
  if(!RD.map)return; var cv=document.getElementById('map-canvas'); if(!cv)return;
  var W=cv.clientWidth,H=cv.clientHeight;
  if(W<=0||H<=0)return;
  cv.width=W*mapDpr;cv.height=H*mapDpr;
  baseCv.width=W*mapDpr;baseCv.height=H*mapDpr;trailCv.width=W*mapDpr;trailCv.height=H*mapDpr;heatCv.width=W*mapDpr;heatCv.height=H*mapDpr;
  mapCtx.setTransform(mapDpr,0,0,mapDpr,0,0);
  baseCv.getContext('2d').setTransform(mapDpr,0,0,mapDpr,0,0);
  trailCv.getContext('2d').setTransform(mapDpr,0,0,mapDpr,0,0);
  clampPan();redrawMap();
}
function drawBase(){
  if(!baseCv)return;var ctx=baseCv.getContext('2d');ctx.clearRect(0,0,baseCv.width,baseCv.height);
  var T=mapTransform();
  Object.keys(RD.map.vehicles).forEach(function(v){
    if(!mapSel[v])return;var pts=RD.map.vehicles[v];ctx.beginPath();
    for(var i=0;i<pts.length;i++){var X=T.X(pts[i][1]),Y=T.Y(pts[i][2]);if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}
    ctx.strokeStyle=hexA(vehColor(v),0.16);ctx.lineWidth=1;ctx.stroke();
  });
}
function drawTrail(t0,t1,full){
  if(!trailCv)return;var ctx=trailCv.getContext('2d');
  if(full)ctx.clearRect(0,0,trailCv.width,trailCv.height);
  var T=mapTransform();
  Object.keys(RD.map.vehicles).forEach(function(v){
    if(!mapSel[v])return;var pts=RD.map.vehicles[v];
    var i0=bsearch(pts,t0-1e-6);
    ctx.beginPath();var started=false;
    for(var i=i0;i<pts.length;i++){
      if(pts[i][0]>t1)break;
      var X=T.X(pts[i][1]),Y=T.Y(pts[i][2]);
      if(!started){ctx.moveTo(X,Y);started=true;}else ctx.lineTo(X,Y);
    }
    if(started){ctx.strokeStyle=hexA(vehColor(v),0.95);ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.stroke();}
  });
}
function heatBand(v){
  if(v<=1)return [78,158,92,170];      // 0-1  绿
  if(v<11)return [224,146,47,195];     // 1-11 橙
  return [199,71,47,215];              // >=11 红
}
function drawHeat(){
  if(!heatCv)return;
  var cv=document.getElementById('map-canvas');if(!cv)return;
  var W=cv.clientWidth,H=cv.clientHeight,ctx=heatCv.getContext('2d');
  ctx.setTransform(mapDpr,0,0,mapDpr,0,0);ctx.clearRect(0,0,W,H);
  if(!mapHeat||!RD.map||W<=0||H<=0)return;
  var T=mapTransform(),cell=6,gw=Math.ceil(W/cell),gh=Math.ceil(H/cell);
  if(gw<1||gh<1)return;
  var grid=new Float32Array(gw*gh),max=0;
  Object.keys(RD.map.vehicles).forEach(function(v){
    if(!mapSel[v])return;var pts=RD.map.vehicles[v];
    for(var i=0;i<pts.length;i++){
      var gx=(T.X(pts[i][1])/cell)|0,gy=(T.Y(pts[i][2])/cell)|0;
      if(gx<0||gy<0||gx>=gw||gy>=gh)continue;
      var n=++grid[gy*gw+gx];if(n>max)max=n;
    }
  });
  if(!max)return;
  var small=document.createElement('canvas');small.width=gw;small.height=gh;
  var sctx=small.getContext('2d'),img=sctx.createImageData(gw,gh),d=img.data;
  for(var k=0;k<grid.length;k++){
    var gv=grid[k];if(gv<=0)continue;
    var c=heatBand(gv);
    d[k*4]=c[0];d[k*4+1]=c[1];d[k*4+2]=c[2];d[k*4+3]=c[3];
  }
  sctx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(small,0,0,W,H);
}
function paintFrame(){
  if(!mapCtx)return;var cv=document.getElementById('map-canvas');
  if(!baseCv||!baseCv.width||!baseCv.height||!trailCv||!trailCv.width||!trailCv.height)return;
  mapCtx.clearRect(0,0,cv.width,cv.height);
  if(heatCv&&heatCv.width)mapCtx.drawImage(heatCv,0,0,cv.clientWidth,cv.clientHeight);
  mapCtx.drawImage(baseCv,0,0,cv.clientWidth,cv.clientHeight);
  mapCtx.drawImage(trailCv,0,0,cv.clientWidth,cv.clientHeight);
  var T=mapTransform();
  Object.keys(RD.map.vehicles).forEach(function(v){
    if(!mapSel[v])return;var pts=RD.map.vehicles[v];var i=bsearch(pts,mapT);if(i<0||!pts[i])return;
    var x=T.X(pts[i][1]),y=T.Y(pts[i][2]);
    mapCtx.beginPath();mapCtx.arc(x,y,5.5,0,6.2832);mapCtx.fillStyle=vehColor(v);mapCtx.fill();
    mapCtx.lineWidth=1.6;mapCtx.strokeStyle='rgba(255,255,255,.9)';mapCtx.stroke();
    mapCtx.fillStyle='rgba(255,255,255,.96)';mapCtx.font='600 11px "Microsoft YaHei",sans-serif';
    mapCtx.fillText(v+((pts[i][3]>0.5)?('  '+pts[i][3].toFixed(1)+'m/s'):''), x+9, y-7);
  });
}
function hexA(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')';}
function vehColor(v){var idx=RD.meta.fleet.indexOf(v);return COLORS[(idx<0?0:idx)%COLORS.length];}
function mapLegend(){
  var el=document.getElementById('map-legend');el.innerHTML='';
  RD.map.vehicles=RD.map.vehicles||{};
  var hl=document.createElement('label');
  hl.style.cssText='border-bottom:1px solid var(--grid);margin-bottom:5px;padding-bottom:6px;font-weight:600';
  hl.innerHTML='<input type="checkbox" '+(mapHeat?'checked':'')+'><span class="dot" style="width:16px;height:10px;border-radius:2px;background:linear-gradient(90deg,#4E9E5C 0 33.3%,#E0922F 33.3% 66.6%,#C7472F 66.6% 100%)"></span>'+s('g.heat');
  hl.querySelector('input').onchange=function(e){mapHeat=e.target.checked;drawHeat();paintFrame();};
  el.appendChild(hl);
  Object.keys(RD.map.vehicles).forEach(function(v){
    var lab=document.createElement('label');lab.className=mapSel[v]?'active':'';
    lab.innerHTML='<input type="checkbox" '+(mapSel[v]?'checked':'')+'><span class="dot" style="background:'+vehColor(v)+'"></span>'+v;
    lab.querySelector('input').onchange=function(e){mapSel[v]=e.target.checked;lab.className=mapSel[v]?'active':'';drawHeat();drawBase();drawTrail(0,mapT,true);paintFrame();};
    el.appendChild(lab);
  });
}
function initMap(){
  if(!RD.map)return;
  baseCv=document.createElement('canvas');trailCv=document.createElement('canvas');heatCv=document.createElement('canvas');
  var cv=document.getElementById('map-canvas');mapCtx=cv.getContext('2d');
  mapBounds=RD.map.bounds;
  Object.keys(RD.map.vehicles).forEach(function(v){mapSel[v]=true;});
  mapLegend();
  // speed buttons
  var sb=document.getElementById('map-speedbtns');[1,4,10,30,60].forEach(function(sp){
    var b=document.createElement('button');b.className='speedbtn'+(sp===mapSpeed?' active':'');b.textContent=sp+'x';b.style.marginLeft='4px';
    b.onclick=function(){mapSpeed=sp;sb.querySelectorAll('button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');};
    sb.appendChild(b);
  });
  document.getElementById('map-play').onclick=function(){mapPlaying=!mapPlaying;this.textContent=mapPlaying?s('g.pause'):s('g.play');if(mapPlaying){lastTs=0;requestAnimationFrame(loop);}};
  document.getElementById('map-reset').onclick=function(){mapPlaying=false;document.getElementById('map-play').textContent=s('g.play');mapT=0;drawTrail(0,0,true);paintFrame();syncMapUI();};
  document.getElementById('map-slider').oninput=function(e){mapPlaying=false;document.getElementById('map-play').textContent=s('g.play');mapT=+e.target.value;drawTrail(0,mapT,true);paintFrame();syncMapUI();};
  // zoom / pan
  cv.addEventListener('wheel',function(e){e.preventDefault();var r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.2:1/1.2);},{passive:false});
  cv.addEventListener('mousedown',function(e){if(e.button!==0)return;mapDrag=true;lastX=e.clientX;lastY=e.clientY;cv.classList.add('dragging');});
  window.addEventListener('mousemove',function(e){if(!mapDrag)return;mapPanX+=e.clientX-lastX;mapPanY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;clampPan();redrawMap();});
  window.addEventListener('mouseup',function(){if(!mapDrag)return;mapDrag=false;cv.classList.remove('dragging');});
  var zin=document.getElementById('map-zin'),zout=document.getElementById('map-zout'),zfit=document.getElementById('map-zfit');
  if(zin)zin.onclick=function(){zoomAt(cv.clientWidth/2,cv.clientHeight/2,1.3);};
  if(zout)zout.onclick=function(){zoomAt(cv.clientWidth/2,cv.clientHeight/2,1/1.3);};
  if(zfit)zfit.onclick=function(){mapZoom=1;mapPanX=0;mapPanY=0;redrawMap();};
  resizeMap();
  requestAnimationFrame(function(){resizeMap();});
  if(window.ResizeObserver){var ro=new ResizeObserver(function(){resizeMap();});ro.observe(cv);}
  window.addEventListener('resize',function(){Object.keys(CHARTS).forEach(function(k){try{CHARTS[k].resize()}catch(e){}});resizeMap();});
}
function syncMapUI(){document.getElementById('map-time').textContent=fmtT(mapT);document.getElementById('map-slider').value=mapT;}
function loop(ts){
  if(!mapPlaying)return;if(!lastTs)lastTs=ts;var dtr=(ts-lastTs)/1000;lastTs=ts;
  var prev=mapT;mapT=Math.min(86400,mapT+dtr*mapSpeed);
  drawTrail(prev,mapT,false);paintFrame();syncMapUI();
  if(mapT>=86400){mapPlaying=false;document.getElementById('map-play').textContent=s('g.play');return;}
  requestAnimationFrame(loop);
}

/* ===================== download ===================== */
function saveHtml(name,html){var u=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));var a=document.createElement('a');a.href=u;a.setAttribute('download',name);document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},2000);}
function initDownload(){
  document.getElementById('download-btn').onclick=function(){
    var name=(document.title||'report').replace(/[\\/:*?"<>|]/g,'_')+'.html';
    if(location.protocol!=='file:'){
      var a=document.createElement('a');a.href=location.pathname;a.setAttribute('download',name);document.body.appendChild(a);a.click();document.body.removeChild(a);
    }else{
      saveHtml(name,'<!DOCTYPE html>\n'+document.documentElement.outerHTML);
    }
  };
}

/* ===================== upload ===================== */
function initUpload(){
  var zone=document.getElementById('drop-zone'),input=document.getElementById('drop-input');
  zone.innerHTML=s('g.upload.zone');
  var picked=[];
  function list(){document.getElementById('drop-list').textContent=picked.map(function(f){return f.name}).join('  ·  ');}
  function add(fl){for(var i=0;i<fl.length;i++){picked.push(fl[i]);}list();}
  document.getElementById('upload-toggle').onclick=function(){document.getElementById('drop-modal').classList.add('show');};
  document.getElementById('drop-cancel').onclick=function(){document.getElementById('drop-modal').classList.remove('show');document.getElementById('drop-msg').textContent='';document.getElementById('drop-download').classList.add('hidden');document.getElementById('drop-load').classList.add('hidden');};
  zone.onclick=function(){input.click();};
  input.onchange=function(){add(input.files);};
  ['dragenter','dragover'].forEach(function(ev){zone.addEventListener(ev,function(e){e.preventDefault();zone.classList.add('hover');});});
  ['dragleave','drop'].forEach(function(ev){zone.addEventListener(ev,function(e){e.preventDefault();zone.classList.remove('hover');});});
  zone.addEventListener('drop',function(e){add(e.dataTransfer.files);});
  document.getElementById('drop-run').onclick=function(){
    var msg=document.getElementById('drop-msg');
    if(!picked.length){msg.style.color='#9B5040';msg.textContent=s('g.upload.nofile');return;}
    if(location.protocol==='file:'){msg.style.color='#9B5040';msg.textContent=LANG==='en'?'Please open via the local service (启动报告.bat).':'请通过本地服务(启动报告.bat)打开本页后再上传。';return;}
    var fd=new FormData();picked.forEach(function(f){fd.append('files',f,f.name);});
    msg.style.color='#4A6E5C';msg.textContent=s('g.upload.running');
    fetch('/api/build',{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(j){
      if(j.ok){
        msg.textContent=s('g.upload.ok');
        var url='/'+encodeURIComponent(j.report);
        var dl=document.getElementById('drop-download');
        dl.href=url;dl.setAttribute('download',j.report);dl.classList.remove('hidden');
        var ld=document.getElementById('drop-load');
        ld.classList.remove('hidden');ld.onclick=function(){location.href=url;};
      }
      else{msg.style.color='#9B5040';msg.textContent=s('g.upload.fail')+(j.error||'');}
    }).catch(function(e){msg.style.color='#9B5040';msg.textContent=s('g.upload.fail')+e;});
  };
}
